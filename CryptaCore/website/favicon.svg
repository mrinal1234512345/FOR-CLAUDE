<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#faviconGradient)"/>
  
  <!-- Central cube/block -->
  <g transform="translate(32, 32)">
    <!-- Front face -->
    <rect x="-12" y="-12" width="24" height="24" rx="2" fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    
    <!-- Top face -->
    <polygon points="-12,-12 -8,-18 16,-18 12,-12" fill="rgba(255,255,255,0.7)"/>
    
    <!-- Right face -->
    <polygon points="12,-12 16,-18 16,6 12,12" fill="rgba(255,255,255,0.5)"/>
    
    <!-- Lock symbol in center -->
    <circle cx="0" cy="0" r="4" fill="none" stroke="rgba(37, 99, 235, 0.8)" stroke-width="1.5"/>
    <path d="M -2 -1 Q -2 -3 0 -3 Q 2 -3 2 -1" fill="none" stroke="rgba(37, 99, 235, 0.8)" stroke-width="1" stroke-linecap="round"/>
    <circle cx="0" cy="2" r="1" fill="rgba(37, 99, 235, 0.8)"/>
  </g>
</svg>
